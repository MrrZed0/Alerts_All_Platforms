<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Platform Streamer.bot Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Montserrat:ital,wght@0,700;0,900;1,900&family=Orbitron:wght@700;900&family=Press+Start+2P&family=Rajdhani:wght@600;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>

    :root {
      --accent: #9146FF;
      --accent-glow: rgba(145, 70, 255, 0.65);
      --bg-color: rgba(14, 14, 18, 0.92);
      --text-user: #ffffff;
      --text-title: #d4d4d8;
      --text-detail: #9146FF;
      --badge-text: #ffffff;
      --border-width: 2px;
      --border-radius: 18px;
      --glow-spread: 30px;
      --backdrop-blur: 8px;
      --avatar-size: 80px;
      --user-font-size: 2.2rem;
      --alert-font: 'Montserrat', sans-serif;
      --in-duration: 550ms;
      --out-duration: 450ms;
      --sweep-speed: 2.2s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090c;
      color: #f4f4f5;
      overflow-x: hidden;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121217;
    }
    ::-webkit-scrollbar-thumb {
      background: #2e2e3a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9146FF;
    }

    /* Stage Backgrounds */
    .stage-grid {
      background-color: #0b0b10;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(145, 70, 255, 0.12) 0%, transparent 65%),
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    .stage-checker {
      background-color: #18181b;
      background-image: 
        linear-gradient(45deg, #222228 25%, transparent 25%), 
        linear-gradient(-45deg, #222228 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #222228 75%), 
        linear-gradient(-45deg, transparent 75%, #222228 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    }

    .stage-stream {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #311042 100%);
      position: relative;
    }

    .stage-green {
      background-color: #00ff00;
    }

    /* ============================================================
       ALERT BOX CORE COMPONENT (Shared between Preview & Export)
       ============================================================ */
    #preview-stage-inner {
      perspective: 1200px;
    }

    #alert-box {
      position: relative;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 24px 36px;
      min-width: 480px;
      max-width: 780px;
      background: var(--bg-color);
      backdrop-filter: blur(var(--backdrop-blur));
      -webkit-backdrop-filter: blur(var(--backdrop-blur));
      border: var(--border-width) solid var(--accent);
      border-radius: var(--border-radius);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 var(--glow-spread) var(--accent-glow);
      font-family: var(--alert-font);
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
    }

    /* Layout Orientations */
    #alert-box.layout-row {
      flex-direction: row;
      text-align: left;
    }
    #alert-box.layout-row-reverse {
      flex-direction: row-reverse;
      text-align: right;
    }
    #alert-box.layout-row-reverse .alert-header {
      justify-content: flex-end;
    }
    #alert-box.layout-column {
      flex-direction: column;
      text-align: center;
      min-width: 400px;
      padding: 28px 40px;
      gap: 14px;
    }
    #alert-box.layout-column .alert-header {
      justify-content: center;
    }
    #alert-box.layout-compact {
      flex-direction: row;
      padding: 14px 26px;
      min-width: 380px;
      border-radius: 9999px;
      gap: 18px;
    }

    /* Top Laser Sweep Bar */
    #alert-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), #fff, var(--accent), transparent);
      animation: sweep var(--sweep-speed) infinite linear;
      opacity: var(--sweep-display, 1);
    }

    @keyframes sweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Avatar Container & Idle Animations */
    .avatar-container {
      position: relative;
      width: var(--avatar-size);
      height: var(--avatar-size);
      flex-shrink: 0;
    }

    .avatar-anim-pulse {
      animation: pulseAvatar 2s infinite ease-in-out;
    }
    .avatar-anim-float {
      animation: floatAvatar 2.6s infinite ease-in-out;
    }
    .avatar-anim-spin {
      animation: spinAvatarBorder 6s infinite linear;
    }

    @keyframes pulseAvatar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes spinAvatarBorder {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(4deg) scale(1.03); }
      75% { transform: rotate(-4deg) scale(1.03); }
    }

    .user-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      background: #18181b;
      transition: border-radius 0.25s ease, clip-path 0.25s ease;
    }

    .shape-circle .user-avatar { border-radius: 50%; }
    .shape-rounded .user-avatar { border-radius: 18px; }
    .shape-square .user-avatar { border-radius: 4px; }
    .shape-hexagon .user-avatar {
      border-radius: 0;
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
    }
    .shape-diamond .user-avatar {
      border-radius: 0;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    /* Mini Platform Corner Badge */
    .platform-mini-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0e0e12;
      border: 2px solid var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      z-index: 3;
    }

    .platform-mini-badge svg {
      width: 15px;
      height: 15px;
      fill: var(--accent);
    }

    /* Alert Content */
    .alert-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
      min-width: 0;
    }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .platform-tag {
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--accent);
      color: var(--badge-text);
    }

    .alert-type {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-title);
    }

    .alert-user {
      font-size: var(--user-font-size);
      font-weight: 900;
      font-style: italic;
      color: var(--text-user);
      text-shadow: 0 0 18px var(--accent-glow);
      line-height: 1.1;
      word-break: break-word;
    }

    .alert-detail {
      margin-top: 6px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-detail);
      letter-spacing: 0.5px;
    }

    .alert-detail:empty {
      display: none;
    }

    /* Progress Bar */
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: var(--accent);
      width: 100%;
      transform-origin: left;
    }
    .progress-top .progress-bar {
      bottom: auto;
      top: 0;
    }
    .progress-hidden .progress-bar {
      display: none;
    }

    /* Extra idle motion options */
    .avatar-anim-glow .user-avatar { animation: avatarGlow 1.7s ease-in-out infinite; }
    .avatar-anim-bounce { animation: avatarBounce 1.05s ease-in-out infinite; }
    .avatar-anim-orbit { animation: avatarOrbit 4s ease-in-out infinite; }
    .avatar-anim-shimmer .user-avatar { animation: avatarShimmer 2.2s ease-in-out infinite; }
    @keyframes avatarGlow {
      0%, 100% { box-shadow: 0 0 10px var(--accent-glow); filter: brightness(1); }
      50% { box-shadow: 0 0 28px var(--accent-glow); filter: brightness(1.3); }
    }
    @keyframes avatarBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-8px) scale(1.035); }
      65% { transform: translateY(0) scale(.98); }
    }
    @keyframes avatarOrbit {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(5deg) translateY(-2px); }
      50% { transform: rotate(0deg) translateY(0); }
      75% { transform: rotate(-5deg) translateY(2px); }
    }
    @keyframes avatarShimmer {
      0%, 100% { filter: brightness(1) saturate(1); }
      50% { filter: brightness(1.35) saturate(1.25); }
    }

    /* Optional image.png artwork. Intrinsic aspect ratio is preserved and the image is constrained to fit. */
    .custom-image-container {
      display: none;
      flex: 0 1 auto;
      align-items: center;
      justify-content: center;
      min-width: 0;
      max-width: min(180px, 25vw);
      max-height: min(150px, 30vh);
      overflow: hidden;
      z-index: 2;
    }
    .custom-alert-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: min(150px, 30vh);
      object-fit: contain;
      object-position: center;
      border-radius: 8px;
    }
    #alert-box.layout-column .custom-image-container {
      max-width: min(260px, 45vw);
      max-height: min(170px, 25vh);
    }
    #alert-box.layout-column .custom-alert-image { max-height: min(170px, 25vh); }

    /* Progress-bar appearance effects. These animate color/opacity rather than transform so the timer scale remains intact. */
    .progress-effect-shimmer .progress-bar {
      background: linear-gradient(90deg, var(--accent) 0%, #ffffff 45%, var(--accent) 70%);
      background-size: 220% 100%;
      animation: progressShimmer 1.15s linear infinite;
    }
    .progress-effect-pulse .progress-bar { animation: progressPulse .75s ease-in-out infinite alternate; }
    .progress-effect-stripes .progress-bar {
      background-image: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,255,255,.48) 8px 13px);
      background-color: var(--accent);
      background-size: 38px 100%;
      animation: progressStripes .7s linear infinite;
    }
    .progress-effect-glow .progress-bar {
      box-shadow: 0 0 8px var(--accent-glow), 0 0 18px var(--accent-glow);
      animation: progressGlow 1.15s ease-in-out infinite alternate;
    }
    .progress-effect-segmented .progress-bar {
      background-image: repeating-linear-gradient(90deg, var(--accent) 0 14px, transparent 14px 18px);
    }
    .progress-effect-none .progress-bar { animation: none; box-shadow: none; }
    @keyframes progressShimmer { from { background-position: 100% 0; } to { background-position: -120% 0; } }
    @keyframes progressPulse { from { opacity: .65; filter: brightness(.85); } to { opacity: 1; filter: brightness(1.55); } }
    @keyframes progressStripes { from { background-position: 0 0; } to { background-position: 38px 0; } }
    @keyframes progressGlow { from { opacity: .75; filter: brightness(.95); } to { opacity: 1; filter: brightness(1.65); } }

    /* ============================================================
       25+ ENTRANCE (IN) ANIMATION KEYFRAMES
       ============================================================ */
    .anim-in-slideUpFade { animation: inSlideUpFade var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inSlideUpFade {
      0% { opacity: 0; transform: translateY(65px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .anim-in-slideDown { animation: inSlideDown var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inSlideDown {
      0% { opacity: 0; transform: translateY(-75px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .anim-in-slideLeft { animation: inSlideLeft var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inSlideLeft {
      0% { opacity: 0; transform: translateX(-140px) scale(0.9); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    .anim-in-slideRight { animation: inSlideRight var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inSlideRight {
      0% { opacity: 0; transform: translateX(140px) scale(0.9); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    .anim-in-elasticBounce { animation: inElasticBounce var(--in-duration) cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards; }
    @keyframes inElasticBounce {
      0% { opacity: 0; transform: scale(0.3); }
      55% { opacity: 1; transform: scale(1.08); }
      75% { transform: scale(0.95); }
      90% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    .anim-in-popOvershoot { animation: inPopOvershoot var(--in-duration) cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes inPopOvershoot {
      0% { opacity: 0; transform: scale(0.5) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .anim-in-flip3DX { animation: inFlip3DX var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inFlip3DX {
      0% { opacity: 0; transform: perspective(1000px) rotateX(-85deg) translateY(-20px); }
      60% { opacity: 1; transform: perspective(1000px) rotateX(12deg); }
      100% { opacity: 1; transform: perspective(1000px) rotateX(0deg) translateY(0); }
    }

    .anim-in-flip3DY { animation: inFlip3DY var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inFlip3DY {
      0% { opacity: 0; transform: perspective(1000px) rotateY(85deg) scale(0.85); }
      60% { opacity: 1; transform: perspective(1000px) rotateY(-10deg) scale(1.02); }
      100% { opacity: 1; transform: perspective(1000px) rotateY(0deg) scale(1); }
    }

    .anim-in-glitchIn { animation: inGlitch var(--in-duration) steps(2, end) forwards; }
    @keyframes inGlitch {
      0% { opacity: 0; transform: translate(-18px, 6px) skewX(25deg); filter: hue-rotate(90deg) contrast(200%); clip-path: inset(20% 0 50% 0); }
      20% { opacity: 1; transform: translate(14px, -6px) skewX(-20deg); filter: hue-rotate(-90deg); clip-path: inset(60% 0 10% 0); }
      40% { transform: translate(-10px, 4px) scale(1.04); clip-path: inset(10% 0 70% 0); }
      60% { transform: translate(8px, -3px) skewX(10deg); filter: hue-rotate(45deg); clip-path: inset(0 0 0 0); }
      80% { transform: translate(-4px, 0) skewX(-5deg); filter: none; }
      100% { opacity: 1; transform: translate(0, 0) skewX(0); filter: none; }
    }

    .anim-in-tornadoSpin { animation: inTornadoSpin var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inTornadoSpin {
      0% { opacity: 0; transform: rotate(-540deg) scale(0.1); filter: blur(8px); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); filter: blur(0px); }
    }

    .anim-in-skewSpeed { animation: inSkewSpeed var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inSkewSpeed {
      0% { opacity: 0; transform: translateX(-220px) skewX(-35deg); }
      65% { opacity: 1; transform: translateX(15px) skewX(12deg); }
      85% { transform: translateX(-5px) skewX(-4deg); }
      100% { opacity: 1; transform: translateX(0) skewX(0deg); }
    }

    .anim-in-dropBounce { animation: inDropBounce var(--in-duration) ease-out forwards; }
    @keyframes inDropBounce {
      0% { opacity: 0; transform: translateY(-200px); }
      45% { opacity: 1; transform: translateY(0); }
      65% { transform: translateY(-32px); }
      82% { transform: translateY(0); }
      92% { transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .anim-in-neonFlicker { animation: inNeonFlicker var(--in-duration) linear forwards; }
    @keyframes inNeonFlicker {
      0% { opacity: 0; transform: scale(0.96); filter: brightness(0); }
      15% { opacity: 0.9; filter: brightness(2.5); }
      25% { opacity: 0.1; filter: brightness(0.2); }
      40% { opacity: 1; filter: brightness(2); }
      55% { opacity: 0.25; }
      70% { opacity: 1; filter: brightness(1.5); }
      85% { opacity: 0.6; }
      100% { opacity: 1; transform: scale(1); filter: brightness(1); }
    }

    .anim-in-unfoldHorizontal { animation: inUnfoldHorizontal var(--in-duration) cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes inUnfoldHorizontal {
      0% { opacity: 0; transform: scaleX(0.02) scaleY(0.05); }
      50% { opacity: 1; transform: scaleX(1.03) scaleY(0.05); }
      100% { opacity: 1; transform: scaleX(1) scaleY(1); }
    }

    .anim-in-rubberBand { animation: inRubberBand var(--in-duration) ease-out forwards; }
    @keyframes inRubberBand {
      0% { opacity: 0; transform: scale3d(0.5, 0.5, 1); }
      35% { opacity: 1; transform: scale3d(1.22, 0.78, 1); }
      50% { transform: scale3d(0.82, 1.18, 1); }
      65% { transform: scale3d(1.1, 0.9, 1); }
      80% { transform: scale3d(0.96, 1.04, 1); }
      100% { opacity: 1; transform: scale3d(1, 1, 1); }
    }

    .anim-in-earthquakeSlam { animation: inEarthquakeSlam var(--in-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes inEarthquakeSlam {
      0% { opacity: 0; transform: scale(2.4); filter: blur(10px); }
      40% { opacity: 1; transform: scale(0.95) translate(-8px, 6px); filter: blur(0px); }
      55% { transform: translate(8px, -6px); }
      70% { transform: translate(-6px, -4px); }
      85% { transform: translate(4px, 4px); }
      100% { opacity: 1; transform: scale(1) translate(0, 0); }
    }

    .anim-in-zoomFade { animation: inZoomFade var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inZoomFade { 0% { opacity: 0; transform: scale(.18); filter: blur(12px); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
    .anim-in-rotateIn { animation: inRotateIn var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inRotateIn { 0% { opacity: 0; transform: rotate(-145deg) scale(.35); } 75% { opacity: 1; transform: rotate(10deg) scale(1.04); } 100% { opacity: 1; transform: rotate(0) scale(1); } }
    .anim-in-bounceInLeft { animation: inBounceInLeft var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inBounceInLeft { 0% { opacity: 0; transform: translateX(-360px) scale(.75); } 65% { opacity: 1; transform: translateX(22px) scale(1.03); } 82% { transform: translateX(-9px); } 100% { opacity: 1; transform: translateX(0); } }
    .anim-in-bounceInRight { animation: inBounceInRight var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inBounceInRight { 0% { opacity: 0; transform: translateX(360px) scale(.75); } 65% { opacity: 1; transform: translateX(-22px) scale(1.03); } 82% { transform: translateX(9px); } 100% { opacity: 1; transform: translateX(0); } }
    .anim-in-blurFocus { animation: inBlurFocus var(--in-duration) ease-out forwards; }
    @keyframes inBlurFocus { 0% { opacity: 0; filter: blur(24px); transform: scale(1.12); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }
    .anim-in-spiralIn { animation: inSpiralIn var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inSpiralIn { 0% { opacity: 0; transform: rotate(-720deg) scale(.08); filter: blur(8px); } 100% { opacity: 1; transform: rotate(0) scale(1); filter: blur(0); } }
    .anim-in-cardFlip { animation: inCardFlip var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inCardFlip { 0% { opacity: 0; transform: perspective(900px) rotateY(-180deg) scale(.8); } 72% { opacity: 1; transform: perspective(900px) rotateY(14deg); } 100% { opacity: 1; transform: perspective(900px) rotateY(0); } }
    .anim-in-lightningIn { animation: inLightningIn var(--in-duration) steps(2, end) forwards; }
    @keyframes inLightningIn { 0% { opacity: 0; transform: translateX(-18px); filter: brightness(3); clip-path: inset(0 100% 0 0); } 22% { opacity: 1; filter: brightness(.5); clip-path: inset(20% 0 35% 0); } 45% { transform: translateX(12px); filter: brightness(2); clip-path: inset(0 0 0 0); } 68% { transform: translateX(-5px); filter: brightness(1.3); } 100% { opacity: 1; transform: translateX(0); filter: none; clip-path: inset(0 0 0 0); } }
    .anim-in-swingDrop { animation: inSwingDrop var(--in-duration) ease-out forwards; transform-origin: top center; }
    @keyframes inSwingDrop { 0% { opacity: 0; transform: translateY(-160px) rotate(18deg); } 55% { opacity: 1; transform: translateY(0) rotate(-8deg); } 75% { transform: rotate(4deg); } 100% { opacity: 1; transform: rotate(0); } }
    .anim-in-materialize { animation: inMaterialize var(--in-duration) cubic-bezier(.16, 1, .3, 1) forwards; }
    @keyframes inMaterialize { 0% { opacity: 0; transform: scale(.92); filter: blur(18px) brightness(2); } 35% { opacity: .35; filter: blur(8px) brightness(1.8); } 100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); } }

    /* ============================================================
       22+ EXIT (OUT) ANIMATION KEYFRAMES
       ============================================================ */
    .anim-out-floatUpFade { animation: outFloatUpFade var(--out-duration) cubic-bezier(0.4, 0, 1, 1) forwards; }

    function hexToRgb(hex) {
      const clean = (hex || "#9146FF").replace("#", "");
      const num = parseInt(clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function getLuminance(hex) {
      const { r, g, b } = hexToRgb(hex);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }

    function resolveAccent(platform, typeKey, overrideColor) {
      if (typeKey === "shoutout" && !(overrideColor && overrideColor.startsWith("#"))) return FX.platColor(CONFIG, platform);
      if (overrideColor && overrideColor.startsWith("#")) return overrideColor;
      if (CONFIG.colorMode === "custom") return CONFIG.customAccent;
      if (CONFIG.colorMode === "eventType") return CONFIG.eventColors[typeKey] || CONFIG.twitchColor;
      return FX.platColor(CONFIG, platform);

    async function resolveAvatarUrl(username, platform, providedAvatar, typeKey) {
      if (providedAvatar && providedAvatar.startsWith("http")) return providedAvatar;
      const cleanUser = (username || "").trim();
      if (!cleanUser || cleanUser.toLowerCase() === "anonymous") return getFallbackAvatar("?", platform, typeKey);

        if (platform === "twitch") {
          const res = await fetch(`https://decapi.me/twitch/avatar/${encodeURIComponent(cleanUser)}`);

    function playSynthSound(type) {
      if (CONFIG.synthPreset === "none" || CONFIG.volume <= 0) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();

        if (FX.isSynth(preset)) { FX.playSynth(audioCtx, preset, CONFIG.volume, type); return; }

        if (preset === "laser") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.44);
          return;

        }

        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + idx * step);
          gain.gain.setValueAtTime(0.001, now + idx * step);
          gain.gain.exponentialRampToValueAtTime(CONFIG.volume * 0.3, now + idx * step + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * step + 0.42);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * step);
          osc.stop(now + idx * step + 0.44);
        });
      } catch (e) {}
    }

    const alertTitle = document.getElementById("alert-title");
    const alertUsername = document.getElementById("alert-username");
    const alertDetail = document.getElementById("alert-detail");
    const progressBar = document.getElementById("progress-bar");

    function pickEffect(id, list) {
      if (id !== "random") return id;
      return list[Math.floor(Math.random() * list.length)];
    }

    function enqueueAlert(data) {
      alertQueue.push(data);
      if (!isShowingAlert) processQueue();
    }

    async function processQueue() {
      if (alertQueue.length === 0) {
        isShowingAlert = false;
        return;
      }
      isShowingAlert = true;
      const current = alertQueue.shift();

      const rawPlatform = (current.platform || "twitch").toLowerCase();
      const platform = FX.normPlatform(rawPlatform);
      const typeKey = (current.type || "follow").toLowerCase();
      currentAvatarAnimation = pickEffect(CONFIG.avatarAnim, AVATAR_LIST);
      currentProgressEffect = pickEffect(CONFIG.progressEffect || "solid", PROGRESS_LIST);

      applyTheme(platform, typeKey, current.color);

      const displayTitle = current.title || CONFIG.typeLabels[typeKey] || typeKey.toUpperCase();
      const username = current.user || "Anonymous";

      const avatarUrl = await resolveAvatarUrl(username, platform, current.avatar, typeKey);
      userAvatar.onerror = () => {
        userAvatar.onerror = null;
        userAvatar.src = getFallbackAvatar(username, platform, typeKey);
      };
      userAvatar.src = avatarUrl;

      platformIcon.innerHTML = FX.ICONS[platform] || ICONS[platform] || ICONS.twitch;
      platformName.textContent = FX.PNAME[platform] || platform.toUpperCase();
      alertTitle.textContent = displayTitle;
      alertUsername.textContent = username;
      alertDetail.textContent = current.useTemplate
        ? formatAlertDetail(current, typeKey, platform, username)
        : (current.detail || "");

      FX.refit();
      const inAnim = pickEffect(current.inEffect || CONFIG.inEffect, IN_LIST);
      const outAnim = pickEffect(current.outEffect || CONFIG.outEffect, OUT_LIST);

      alertBox.className = getAlertBoxBaseClass();
      void alertBox.offsetWidth;
      alertBox.classList.add(`anim-in-${inAnim}`);

      progressBar.style.transition = "none";
      progressBar.style.transform = "scaleX(1)";
      void progressBar.offsetWidth;
      progressBar.style.transition = `transform ${CONFIG.alertDuration}ms linear`;
      progressBar.style.transform = "scaleX(0)";

      playAlertSound(typeKey, current.sound);

      setTimeout(() => {
        alertBox.className = `${getAlertBoxBaseClass()} anim-out-${outAnim}`;
        setTimeout(() => {
          alertBox.className = getAlertBoxBaseClass();
          setTimeout(() => {
            processQueue();
          }, CONFIG.queueDelay);
        }, CONFIG.outDuration);
      }, CONFIG.alertDuration);
    }

    function connectWebSocket() {
      const ws = new WebSocket(CONFIG.wsUrl);
      ws.onopen = () => {
        ws.send(JSON.stringify({
          request: "Subscribe",
          id: "obs-alert-overlay",
          events: {
            General: ["Custom"],
            Twitch: ["Follow", "Sub", "ReSub", "GiftSub", "Raid", "Cheer"],
            Kick: ["Follow", "Subscription", "Resubscription", "GiftSubscription", "Raid", "Kicks"]
          }
        }));
        FX.subscribeExtra(ws);
      };
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (!msg.event) return;
          const source = msg.event.source;
          const type = msg.event.type;
          const data = msg.data || {};

          if (source === "General" && type === "Custom") {
            const payload = data.data || data;
            if (payload && (payload.alert || payload.user)) {
              enqueueAlert({
                platform: payload.platform || payload.userType || "twitch",
                type: payload.type || "follow",
                title: payload.title || "",
                user: payload.user || "Someone",
                avatar: payload.avatar || "",
                detail: payload.detail || "",
                sound: payload.sound || "",
                color: payload.color || "",
                inEffect: payload.inEffect || "",
                outEffect: payload.outEffect || "",
                useTemplate: payload.useTemplate === true,
                recipient: payload.recipient || payload.recipientUserName || "",
                viewers: payload.viewers ?? payload.viewer_count ?? "",
                months: payload.months ?? payload.cumulativeMonths ?? "",
                amount: payload.amount ?? payload.bits ?? "", game: payload.game ?? "", message: payload.message ?? "", currency: payload.currency ?? "", tier: payload.tier ?? "", count: payload.count ?? ""
              });
            }
            return;
          }

          if (!CONFIG.customActionsOnly && ["YouTube", "Streamlabs", "StreamElements"].includes(source)) {
            const fxAlert = FX.fromRaw(source, type, data);
            if (fxAlert) enqueueAlert(fxAlert);
            return;
          }

          if ((source === "Twitch" || source === "Kick") && !CONFIG.customActionsOnly) {
            const user = data.user?.name || data.user?.displayName || data.user_name || data.username || data.from_broadcaster_user_name;
            if (!user) return;
            const avatar = data.user?.profileImageUrl || data.user?.avatar || data.profile_image_url || data.avatar || "";
            let alertType = "follow";
            let detail = "Welcome to the stream!";
            const templateData = { recipient: data.recipient?.name || data.recipientUserName || data.recipient?.displayName || "the community", viewers: data.viewers || data.viewer_count || 1, months: data.cumulativeMonths || data.cumulative_months || data.months || "", amount: data.bits || data.amount || "" };
            if (type.includes("Gift")) {
              alertType = "giftsub";
              detail = `Gifted a sub to ${templateData.recipient}!`;
            } else if (type.includes("ReSub") || type.includes("Resub")) {
              alertType = "resub";
              detail = templateData.months ? `${templateData.months} Months!` : "Resubscribed!";
            } else if (type.includes("Sub")) {
              alertType = "sub";
              detail = "Just subscribed!";
            } else if (type.includes("Raid")) {
              alertType = "raid";
              detail = `Raiding with ${templateData.viewers} viewers!`;
            } else if (type === "Cheer" || type === "Kicks") {
              alertType = "cheer";
              detail = templateData.amount ? `Sent ${templateData.amount} ${source === "Kick" ? "Kicks" : "Bits"}!` : "";
            }
            enqueueAlert({ platform: source.toLowerCase(), type: alertType, user, avatar, detail, useTemplate: true, ...templateData });
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
      ws.onerror = () => ws.close();
    }

    setupCustomImage();
    connectWebSocket();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("test") === "true") {
      setTimeout(() => {
        enqueueAlert({ platform: "twitch", type: "follow", user: "MrrZed0", detail: "Thanks for the follow!" });
        enqueueAlert({ platform: "kick", type: "sub", user: "xQc", detail: "Tier 1 Subscriber!" });
        enqueueAlert({ platform: "twitch", type: "raid", user: "shroud", detail: "Raiding with 48 viewers!" });
      }, 500);
    }
  </script>
</body>
